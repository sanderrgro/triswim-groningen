<!DOCTYPE html>
<html lang="nl" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TriSwim Groningen - Banenzwemmen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #map { height: calc(100vh - 140px); width: 100%; z-index: 10; }
    .leaflet-tile { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7); }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased pb-20 select-none">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="bg-cyan-500/20 p-2 rounded-xl text-cyan-400">
        <i data-lucide="waves" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white leading-tight">TriSwim</h1>
        <p class="text-xs text-slate-400">Banenzwemmen Regio Groningen</p>
      </div>
    </div>
    <span class="bg-slate-800 text-cyan-400 text-xs px-2.5 py-1 rounded-full border border-cyan-500/30 font-semibold">
      Triatlon Focus
    </span>
  </header>

  <!-- CONTENT -->
  <main class="flex-1 overflow-y-auto p-4 max-w-md mx-auto w-full space-y-4">
    <!-- TAB 1: DASHBOARD -->
    <section id="tab-dashboard" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Vandaag Beschikbaar</h2>
        <span class="text-xs text-slate-500 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live data
        </span>
      </div>
      <div id="today-list" class="space-y-3"></div>
    </section>

    <!-- TAB 2: ROOSTER -->
    <section id="tab-roster" class="hidden space-y-4">
      <!-- Week navigatie -->
      <div class="flex items-center justify-between bg-slate-800/80 p-2.5 rounded-2xl border border-slate-700/50">
        <button onclick="changeWeek(-1)" class="p-1.5 rounded-xl bg-slate-700/50 text-slate-300 hover:bg-slate-700 hover:text-white transition">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <div class="text-center">
          <div id="week-label" class="text-xs font-bold text-cyan-400 uppercase tracking-wider">Deze week</div>
          <div id="week-range" class="text-xs text-slate-400"></div>
        </div>
        <button onclick="changeWeek(1)" class="p-1.5 rounded-xl bg-slate-700/50 text-slate-300 hover:bg-slate-700 hover:text-white transition">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Dagen kiezer -->
      <div id="day-selector" class="flex gap-1.5 overflow-x-auto no-scrollbar py-1"></div>

      <!-- Lijst met sessies -->
      <div id="roster-list" class="space-y-3"></div>
    </section>

    <!-- TAB 3: KAART -->
    <section id="tab-map" class="hidden">
      <div class="rounded-2xl overflow-hidden border border-slate-800 relative">
        <div id="map"></div>
      </div>
    </section>
  </main>

  <!-- NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 py-2 px-6">
    <div class="max-w-md mx-auto flex justify-around items-center">
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn flex flex-col items-center gap-1 text-cyan-400">
        <i data-lucide="clock" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Vandaag</span>
      </button>
      <button onclick="switchTab('roster')" id="nav-roster" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Rooster</span>
      </button>
      <button onclick="switchTab('map')" id="nav-map" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="map-pin" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Kaart</span>
      </button>
    </div>
  </nav>

  <script>
    let POOLS = {};
    let SESSIONS = [];
    let leafletMap = null;

    // Helper om weekdagnummer (1 = Maandag, 7 = Zondag) om te zetten naar Nederlandse naam
    const DAY_NAMES_MAP = {
      1: "Maandag",
      2: "Dinsdag",
      3: "Woensdag",
      4: "Donderdag",
      5: "Vrijdag",
      6: "Zaterdag",
      7: "Zondag"
    };

    let currentWeekOffset = 0;
    let selectedDate = new Date();

    function getMonday(d, weekOffset = 0) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(date.setDate(diff));
      monday.setDate(monday.getDate() + (weekOffset * 7));
      return monday;
    }

    function formatDateISO(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    async function loadData() {
      try {
        const response = await fetch('schedule.json');
        if (!response.ok) throw new Error(`HTTP-fout: ${response.status}`);
        const data = await response.json();
        
        POOLS = data.pools || {};
        SESSIONS = data.sessions || data.recurring_schedule || [];
        
        renderToday();
        updateWeekView();
      } catch (err) {
        console.error("Fout bij inladen data:", err);
        const errHtml = `<div class="text-center py-8 text-rose-400 text-sm">Fout bij laden van schedule.json.</div>`;
        document.getElementById('today-list').innerHTML = errHtml;
        document.getElementById('roster-list').innerHTML = errHtml;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadData();
    });

    function switchTab(tab) {
      ['dashboard', 'roster', 'map'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const btn = document.getElementById(`nav-${t}`);
        btn.classList.remove('text-cyan-400');
        btn.classList.add('text-slate-400');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      const active = document.getElementById(`nav-${tab}`);
      active.classList.add('text-cyan-400');
      active.classList.remove('text-slate-400');

      if (tab === 'map' && !leafletMap) initMap();
    }

    function filterSessionsForDate(targetDate) {
      const dateISO = formatDateISO(targetDate);
      const dayNum = targetDate.getDay() === 0 ? 7 : targetDate.getDay();
      const dayName = DAY_NAMES_MAP[dayNum];

      return SESSIONS.filter(s => {
        // Specifieke datummatch
        if (s.date) return s.date === dateISO;
        // Match op dag van de week (zoals "Maandag" of nummer)
        if (s.day_of_week) return s.day_of_week.toLowerCase() === dayName.toLowerCase();
        if (s.day) return Number(s.day) === dayNum;
        return false;
      });
    }

    function renderToday() {
      const container = document.getElementById('today-list');
      const todaySessions = filterSessionsForDate(new Date());

      if (!todaySessions.length) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Geen banenzwemmen gepland voor vandaag.</div>`;
        return;
      }

      container.innerHTML = todaySessions.map(s => {
        const poolKey = s.pool_id || s.poolId;
        const p = POOLS[poolKey] || { name: poolKey, city: '', type: '' };
        const activity = s.activity || s.title || 'Banenzwemmen';
        const startTime = s.start_time || s.start;
        const endTime = s.end_time || s.end;
        const poolType = s.pool_type || p.type || '';

        return `
          <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-4 flex justify-between items-center shadow-lg">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 font-medium">${p.city || ''}</span>
                <span class="text-xs text-slate-400">${poolType}</span>
              </div>
              <h3 class="font-bold text-white text-base">${p.name}</h3>
              <p class="text-xs text-slate-400 flex items-center gap-1">
                <i data-lucide="activity" class="w-3 h-3 text-cyan-400"></i> ${activity}
              </p>
            </div>
            <div class="text-right">
              <div class="text-lg font-black text-cyan-400">${startTime}</div>
              <div class="text-xs text-slate-400">tot ${endTime}</div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function changeWeek(offsetChange) {
      currentWeekOffset += offsetChange;
      selectedDate = getMonday(new Date(), currentWeekOffset);
      updateWeekView();
    }

    function updateWeekView() {
      const monday = getMonday(new Date(), currentWeekOffset);
      const sunday = new Date(monday);
      sunday.setDate(sunday.getDate() + 6);

      const labelEl = document.getElementById('week-label');
      if (currentWeekOffset === 0) labelEl.textContent = "Deze week";
      else if (currentWeekOffset === 1) labelEl.textContent = "Volgende week";
      else if (currentWeekOffset === -1) labelEl.textContent = "Vorige week";
      else labelEl.textContent = `Week ${currentWeekOffset > 0 ? '+' + currentWeekOffset : currentWeekOffset}`;

      const options = { day: 'numeric', month: 'short' };
      document.getElementById('week-range').textContent = 
        `${monday.toLocaleDateString('nl-NL', options)} - ${sunday.toLocaleDateString('nl-NL', options)}`;

      renderDaySelector(monday);
      renderRoster(selectedDate);
    }

    function renderDaySelector(mondayDate) {
      const container = document.getElementById('day-selector');
      const dayNames = ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'];
      
      let html = '';
      for (let i = 0; i < 7; i++) {
        const dayDate = new Date(mondayDate);
        dayDate.setDate(dayDate.getDate() + i);
        
        const isSelected = formatDateISO(dayDate) === formatDateISO(selectedDate);
        const dayNum = dayDate.getDate();

        html += `
          <button onclick="selectDate('${dayDate.toISOString()}')" class="flex-1 min-w-[48px] py-2 px-1 rounded-xl text-center transition flex flex-col items-center ${isSelected ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">
            <span class="text-[10px] uppercase opacity-80">${dayNames[i]}</span>
            <span class="text-xs font-bold">${dayNum}</span>
          </button>
        `;
      }
      container.innerHTML = html;
    }

    function selectDate(dateString) {
      selectedDate = new Date(dateString);
      const monday = getMonday(new Date(), currentWeekOffset);
      renderDaySelector(monday);
      renderRoster(selectedDate);
    }

    function renderRoster(targetDate) {
      const container = document.getElementById('roster-list');
      const daySessions = filterSessionsForDate(targetDate);

      if (!daySessions.length) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Geen sessies voor deze dag.</div>`;
        return;
      }

      container.innerHTML = daySessions.map(s => {
        const poolKey = s.pool_id || s.poolId;
        const p = POOLS[poolKey] || { name: poolKey, type: '' };
        const activity = s.activity || s.title || 'Banenzwemmen';
        const startTime = s.start_time || s.start;
        const endTime = s.end_time || s.end;
        const poolType = s.pool_type || p.type || '';

        return `
          <div class="bg-slate-800/40 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
            <div>
              <div class="font-semibold text-sm text-slate-200">${p.name}</div>
              <div class="text-xs text-slate-400">${activity} ${poolType ? `(${poolType})` : ''}</div>
            </div>
            <div class="text-sm font-bold text-slate-300">${startTime} - ${endTime}</div>
          </div>
        `;
      }).join('');
    }

    function initMap() {
      leafletMap = L.map('map').setView([53.2191, 6.5667], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(leafletMap);
      Object.values(POOLS).forEach(p => {
        if (p.lat && p.lng) {
          L.marker([p.lat, p.lng]).addTo(leafletMap).bindPopup(`<b>${p.name}</b><br>${p.type || ''}`);
        }
      });
    }
  </script>
</body>
</html>
