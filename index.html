<!DOCTYPE html>
<html lang="nl" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TriSwim Groningen - Banenzwemmen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    ::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    #map { height: calc(100vh - 140px); width: 100%; z-index: 10; }
    .leaflet-tile { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7); }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased pb-20 select-none">

  <!-- HEADER -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="bg-cyan-500/20 p-2 rounded-xl text-cyan-400">
        <i data-lucide="waves" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg text-white leading-tight">TriSwim</h1>
        <p class="text-xs text-slate-400">Banenzwemmen Regio Groningen</p>
      </div>
    </div>
    <span class="bg-slate-800 text-cyan-400 text-xs px-2.5 py-1 rounded-full border border-cyan-500/30 font-semibold">
      Triatlon Focus
    </span>
  </header>

  <!-- CONTENT -->
  <main class="flex-1 overflow-y-auto p-4 max-w-md mx-auto w-full space-y-4">
    <!-- TAB 1: DASHBOARD (VANDAAG) -->
    <section id="tab-dashboard" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Vandaag Beschikbaar</h2>
        <span class="text-xs text-slate-500 flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Live status
        </span>
      </div>
      <div id="today-list" class="space-y-3"></div>
    </section>

    <!-- TAB 2: ROOSTER -->
    <section id="tab-roster" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Weekrooster</h2>
        <span class="text-xs text-slate-500">Vaste openingstijden</span>
      </div>

      <!-- Dagenkiezer (Ma t/m Zo) -->
      <div id="day-selector" class="flex gap-1.5 overflow-x-auto no-scrollbar py-1"></div>
      
      <!-- Lijst met sessies voor de gekozen dag -->
      <div id="roster-list" class="space-y-3"></div>
    </section>

    <!-- TAB 3: ZWEMBADEN PER LOCATIE -->
    <section id="tab-pools" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Zwembaden</h2>
        <span class="text-xs text-slate-500">Bekijk per locatie</span>
      </div>

      <div id="pools-list" class="space-y-3"></div>
    </section>

    <!-- TAB 4: KAART -->
    <section id="tab-map" class="hidden">
      <div class="rounded-2xl overflow-hidden border border-slate-800 relative">
        <div id="map"></div>
      </div>
    </section>
  </main>

  <!-- NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 py-2 px-4">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn flex-1 flex flex-col items-center gap-1 text-cyan-400">
        <i data-lucide="clock" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Vandaag</span>
      </button>
      <button onclick="switchTab('roster')" id="nav-roster" class="nav-btn flex-1 flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Rooster</span>
      </button>
      <button onclick="switchTab('pools')" id="nav-pools" class="nav-btn flex-1 flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="building-2" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Zwembaden</span>
      </button>
      <button onclick="switchTab('map')" id="nav-map" class="nav-btn flex-1 flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
        <i data-lucide="map-pin" class="w-5 h-5"></i>
        <span class="text-[10px] font-medium">Kaart</span>
      </button>
    </div>
  </nav>

  <script>
    let POOLS = {};
    let SESSIONS = [];
    let leafletMap = null;

    const DAYS_ORDER = [
      { key: "maandag", short: "Ma" },
      { key: "dinsdag", short: "Di" },
      { key: "woensdag", short: "Wo" },
      { key: "donderdag", short: "Do" },
      { key: "vrijdag", short: "Vr" },
      { key: "zaterdag", short: "Za" },
      { key: "zondag", short: "Zo" }
    ];

    const todayIndex = new Date().getDay();
    let selectedDayKey = DAYS_ORDER[todayIndex === 0 ? 6 : todayIndex - 1].key;

    async function loadData() {
      try {
        const response = await fetch('schedule.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error(`HTTP-fout: ${response.status}`);
        const data = await response.json();
        
        POOLS = data.pools || {};
        SESSIONS = data.sessions || data.recurring_schedule || [];
        
        renderToday();
        renderDaySelector();
        renderRoster(selectedDayKey);
        renderPoolsList();
      } catch (err) {
        console.error("Fout bij inladen data:", err);
        const errHtml = `<div class="text-center py-8 text-rose-400 text-sm">Fout bij laden van schedule.json.</div>`;
        document.getElementById('today-list').innerHTML = errHtml;
        document.getElementById('roster-list').innerHTML = errHtml;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadData();
    });

    function switchTab(tab) {
      ['dashboard', 'roster', 'pools', 'map'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const btn = document.getElementById(`nav-${t}`);
        btn.classList.remove('text-cyan-400');
        btn.classList.add('text-slate-400');
      });
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      const active = document.getElementById(`nav-${tab}`);
      active.classList.add('text-cyan-400');
      active.classList.remove('text-slate-400');

      if (tab === 'map' && !leafletMap) initMap();
    }

    function renderToday() {
      const container = document.getElementById('today-list');
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      const dayNum = now.getDay() === 0 ? 6 : now.getDay() - 1;
      const todayName = DAYS_ORDER[dayNum].key;

      const todaySessions = SESSIONS.filter(s => s.day_of_week && s.day_of_week.toLowerCase() === todayName);

      const upcomingSessions = todaySessions.filter(s => {
        const endTime = s.end_time || s.end;
        if (!endTime) return true;
        const [endH, endM] = endTime.split(':').map(Number);
        const endMinutes = endH * 60 + endM;
        return endMinutes > currentMinutes;
      });

      if (!upcomingSessions.length) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Geen geopende zwemsessies meer beschikbaar voor vandaag.</div>`;
        return;
      }

      upcomingSessions.sort((a, b) => (a.start_time || a.start).localeCompare(b.start_time || b.start));

      container.innerHTML = upcomingSessions.map(s => {
        const poolKey = s.pool_id || s.poolId;
        const p = POOLS[poolKey] || { name: poolKey, city: '', type: '' };
        const activity = s.activity || s.title || 'Banenzwemmen';
        const startTime = s.start_time || s.start;
        const endTime = s.end_time || s.end;
        const poolType = s.pool_type || p.type || '';

        const [startH, startM] = startTime.split(':').map(Number);
        const [endH, endM] = endTime.split(':').map(Number);
        const startMinutes = startH * 60 + startM;
        const endMinutes = endH * 60 + endM;

        let statusBadge = '';

        if (currentMinutes >= startMinutes && currentMinutes < endMinutes) {
          if (endMinutes - currentMinutes <= 30) {
            statusBadge = `<span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">Gaat bijna sluiten</span>`;
          } else {
            statusBadge = `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">Nu geopend</span>`;
          }
        } else if (currentMinutes < startMinutes) {
          if (startMinutes - currentMinutes <= 30) {
            statusBadge = `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">Gaat bijna open</span>`;
          } else {
            statusBadge = `<span class="bg-slate-700 text-slate-300 text-[10px] font-medium px-2 py-0.5 rounded-full">Open om ${startTime}</span>`;
          }
        }

        return `
          <div class="bg-slate-800/60 border border-slate-700/50 rounded-2xl p-4 flex justify-between items-center shadow-lg">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 font-medium">${p.city || ''}</span>
                <span class="text-xs text-slate-400">${poolType}</span>
              </div>
              <h3 class="font-bold text-white text-base">${p.name}</h3>
              <div class="pt-1">${statusBadge}</div>
            </div>
            <div class="text-right">
              <div class="text-lg font-black text-cyan-400">${startTime}</div>
              <div class="text-xs text-slate-400">tot ${endTime}</div>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function renderDaySelector() {
      const container = document.getElementById('day-selector');
      
      container.innerHTML = DAYS_ORDER.map(d => {
        const isSelected = d.key === selectedDayKey;
        return `
          <button onclick="selectDay('${d.key}')" class="flex-1 min-w-[44px] py-2.5 rounded-xl text-center transition flex flex-col items-center ${isSelected ? 'bg-cyan-500 text-slate-950 font-bold' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}">
            <span class="text-xs uppercase font-bold">${d.short}</span>
          </button>
        `;
      }).join('');
    }

    function selectDay(dayKey) {
      selectedDayKey = dayKey;
      renderDaySelector();
      renderRoster(dayKey);
    }

    function renderRoster(dayKey) {
      const container = document.getElementById('roster-list');
      const daySessions = SESSIONS.filter(s => s.day_of_week && s.day_of_week.toLowerCase() === dayKey);

      if (!daySessions.length) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Geen sessies gepland voor ${dayKey}.</div>`;
        return;
      }

      daySessions.sort((a, b) => (a.start_time || a.start).localeCompare(b.start_time || b.start));

      container.innerHTML = daySessions.map(s => {
        const poolKey = s.pool_id || s.poolId;
        const p = POOLS[poolKey] || { name: poolKey, type: '' };
        const activity = s.activity || s.title || 'Banenzwemmen';
        const startTime = s.start_time || s.start;
        const endTime = s.end_time || s.end;
        const poolType = s.pool_type || p.type || '';

        return `
          <div class="bg-slate-800/40 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
            <div>
              <div class="font-semibold text-sm text-slate-200">${p.name}</div>
              <div class="text-xs text-slate-400">${activity} ${poolType ? `(${poolType})` : ''}</div>
            </div>
            <div class="text-sm font-bold text-cyan-400">${startTime} - ${endTime}</div>
          </div>
        `;
      }).join('');
    }

    /* NIEUWE FUNCTIE: Zwembadenoverzicht */
    function renderPoolsList() {
      const container = document.getElementById('pools-list');
      const poolEntries = Object.entries(POOLS);

      if (!poolEntries.length) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-sm">Geen zwembaden gevonden.</div>`;
        return;
      }

      container.innerHTML = poolEntries.map(([poolId, pool]) => {
        // Verzamel alle sessies voor dit specifieke zwembad
        const poolSessions = SESSIONS.filter(s => (s.pool_id || s.poolId) === poolId);

        // Groepeer de sessies per dag
        let scheduleHtml = '';
        DAYS_ORDER.forEach(d => {
          const daySessions = poolSessions.filter(s => s.day_of_week && s.day_of_week.toLowerCase() === d.key);
          if (daySessions.length > 0) {
            daySessions.sort((a, b) => (a.start_time || a.start).localeCompare(b.start_time || b.start));
            
            const times = daySessions.map(s => {
              const poolType = s.pool_type ? ` <span class="text-slate-500">(${s.pool_type})</span>` : '';
              return `<div class="flex justify-between text-xs py-0.5"><span class="text-slate-300">${s.start_time || s.start} - ${s.end_time || s.end}</span>${poolType}</div>`;
            }).join('');

            scheduleHtml += `
              <div class="border-b border-slate-700/40 pb-2 mb-2 last:border-0 last:pb-0 last:mb-0">
                <div class="text-xs font-bold text-cyan-400 uppercase mb-1">${d.key}</div>
                <div class="space-y-0.5">${times}</div>
              </div>
            `;
          }
        });

        if (!scheduleHtml) {
          scheduleHtml = `<div class="text-xs text-slate-500 italic">Geen vaste sessies bekend.</div>`;
        }

        return `
          <details class="bg-slate-800/60 border border-slate-700/50 rounded-2xl overflow-hidden group">
            <summary class="p-4 flex justify-between items-center cursor-pointer list-none select-none">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 font-medium">${pool.city || ''}</span>
                  <span class="text-xs text-slate-400">${pool.type || ''}</span>
                </div>
                <h3 class="font-bold text-white text-base">${pool.name}</h3>
              </div>
              <i data-lucide="chevron-down" class="w-5 h-5 text-slate-400 transition-transform group-open:rotate-180"></i>
            </summary>
            <div class="px-4 pb-4 pt-2 border-t border-slate-700/50 bg-slate-900/40 space-y-2">
              ${scheduleHtml}
            </div>
          </details>
        `;
      }).join('');
      lucide.createIcons();
    }

    function initMap() {
      leafletMap = L.map('map').setView([53.2191, 6.5667], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(leafletMap);
      Object.values(POOLS).forEach(p => {
        if (p.lat && p.lng) {
          L.marker([p.lat, p.lng]).addTo(leafletMap).bindPopup(`<b>${p.name}</b><br>${p.type || ''}`);
        }
      });
    }
  </script>
</body>
</html>
